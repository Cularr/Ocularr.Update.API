version: '3.8'

volumes:
  postgres-data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-ocularr}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ocularr}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg-init-scripts:/docker-entrypoint-initdb.d

  ocularr-api:
    image: ghcr.io/cularr/ocularr.update.api:latest
    restart: always
    ports:
      # For a reverse proxy on this host. A proxy in another container uses
      # ocularr-api:5000 on a shared network instead. Forwarded headers are trusted
      # from anything that can reach this port, so the proxy must overwrite
      # X-Forwarded-For. Without a proxy, set FORWARDED_HEADERS_ENABLED=false.
      - "127.0.0.1:5000:5000"
    depends_on:
      - db
    environment:
      # GitHub Configuration (required)
      - Update__GithubOrg=${GITHUB_ORG}
      - Update__GithubToken=${GITHUB_TOKEN}

      # API Configuration (required)
      - Update__ApiKey=${UPDATE_API_KEY}

      # Database Connection
      - ConnectionStrings__Database=Host=db;Port=5432;Username=${DB_USER:-ocularr};Password=${DB_PASSWORD:?Set DB_PASSWORD};Database=${DB_NAME:-ocularr};Enlist=false

      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=${FORWARDED_HEADERS_ENABLED:-true}
    volumes:
      - ./data:/data
