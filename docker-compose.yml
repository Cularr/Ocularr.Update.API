version: '3.8'

volumes:
  postgres-data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-ocularr}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ocularr}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg-init-scripts:/docker-entrypoint-initdb.d

  ocularr-api:
    image: ghcr.io/cularr/ocularr.update.api:latest
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      # GitHub Configuration (required)
      - Update__GithubOrg=${GITHUB_ORG}
      - Update__GithubToken=${GITHUB_TOKEN}

      # API Configuration (required)
      - Update__ApiKey=${UPDATE_API_KEY}

      # Database Connection
      - ConnectionStrings__Database=Host=db;Port=5432;Username=${DB_USER:-ocularr};Password=${DB_PASSWORD:?Set DB_PASSWORD};Database=${DB_NAME:-ocularr};Enlist=false
    volumes:
      - ./data:/data
