version: '3.8'

volumes:
  postgres-data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-ocularr}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ocularr}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg-init-scripts:/docker-entrypoint-initdb.d

  ocularr-api:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourusername/ocularr-update-api}:${VERSION:-latest}
    build: .
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      # GitHub Configuration
      - Update__GithubOrg=${GITHUB_ORG}
      - Update__GithubToken=${GITHUB_TOKEN}
      - Update__Project=${PROJECT:-Ocularr}

      # API Configuration
      - Update__ApiKey=${UPDATE_API_KEY}
      - Update__DataDirectory=/data
      - Update__LogSql=false

      # Database Connection
      - ConnectionStrings__Database=Host=db;Port=5432;Username=${DB_USER:-ocularr};Password=${DB_PASSWORD:?Set DB_PASSWORD};Database=${DB_NAME:-ocularr};Enlist=false

      # ASP.NET Core
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/data
